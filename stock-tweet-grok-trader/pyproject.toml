[project]
name = "stock-tweet-grok-trader"
version = "0.1.0"
description = "Stock tweet and Polymarket trading assistant"
requires-python = ">=3.10"
dependencies = [
    # Upgraded to recent secure versions (addresses CVEs in fastapi, requests, urllib3, pydantic)
    "beautifulsoup4>=4.12.3",
    "eth-account>=0.13.0",
    "fastapi>=0.112.0",
    "openai>=1.40.0",
    "py-clob-client>=0.38.0",
    "pydantic>=2.8.2",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "rich>=13.7.1",
    "tweepy>=4.14.0",
    "uvicorn>=0.30.5",
    "websocket-client>=1.8.0",
    "xai-sdk>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
