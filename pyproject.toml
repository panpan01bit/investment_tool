[project]
name = "investlab"
version = "2.0.0"
description = "本地优先的投资研究工作台：Obsidian 笔记 + 券商报告解析 + 互联网搜索 + 量化信号，参与交易决策"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "panpan01bit" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "feedparser>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "ddgs>=9.0",
]

[project.optional-dependencies]
# 国内数据源（akshare 接口较多、安装较重），按需安装：pip install -e ".[cn]"
cn = ["akshare>=1.14"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
investlab = "investlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investlab"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
