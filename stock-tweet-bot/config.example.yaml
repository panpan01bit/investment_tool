holdings:
  - {display_name: Apple Inc., ticker: AAPL}
  - {display_name: Alphabet, ticker: GOOGL}
  - {display_name: Microsoft, ticker: MSFT}
  - {display_name: NVIDIA, ticker: NVDA}
  - {display_name: Tesla, ticker: TSLA}

min_engagement_score: 0
tweets_per_stock: 15

xai:
  # 强烈建议通过环境变量 XAI_API_KEY 注入，不在文件中保存真实 key
  api_key: "${XAI_API_KEY}"
  api_url: "https://api.x.ai/v1/responses"
  model: grok-4-1-fast-non-reasoning

xai_timeout: 60
xai_retries: 2
